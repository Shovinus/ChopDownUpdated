plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = "${minecraft_version}-${mod_version}"
group = "${group_name}"

base {
    archivesName = "${mod_id}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of((findProperty('java_toolchain_version') ?: '17') as int)

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach { runConfig ->
            if (runConfig.hasProperty('workingDir')) {
                runConfig.workingDir = project.layout.projectDirectory.dir('run')
            } else {
                workingDirectory project.file('run')
            }

            if (runConfig.respondsTo('systemProperty', String, Object)) {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                systemProperty 'forge.logging.console.level', 'debug'
            } else {
                property 'forge.logging.markers', 'REGISTRIES'
                property 'forge.logging.console.level', 'debug'
            }

            mods {
                chopdownupdated {
                    source sourceSets.main
                }
            }
        }

        client {}
        server {
            args '--nogui'
        }
    }
}

repositories {
    if (!configurations.findByName('minecraft')) {
        minecraft.mavenizer(it)
        maven fg.forgeMaven
        maven fg.minecraftLibsMaven
        mavenCentral()
    }
}

dependencies {
    def forgeDependency = "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    if (configurations.findByName('minecraft')) {
        minecraft forgeDependency
    } else {
        implementation minecraft.dependency(forgeDependency)
        annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.main.output.setResourcesDir(sourceSets.main.java.classesDirectory)

tasks.register('cleanForgeRunConfig') {
    doLast {
        delete file('run/config/fml.toml')
    }
}

tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn tasks.named('cleanForgeRunConfig')
}
