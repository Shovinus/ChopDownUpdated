name: Compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: MC ${{ matrix.minecraft }} / Forge ${{ matrix.forge }}
    runs-on: windows-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.21.1"
            forge: "52.1.14"
            java: "17"
            toolchain: "21"
            gradle: "8.12.1"
            forgegradle: "6.0.54"
            minecraft_range: "[1.21,1.21.2)"
            forge_range: "[52,53)"
            loader_range: "[52,53)"
            experimental: false
            note: "Primary supported build target"
          - minecraft: "1.21.11"
            forge: "61.1.8"
            java: "21"
            toolchain: "21"
            gradle: "9.3.0"
            forgegradle: "7.0.31"
            minecraft_range: "[1.21.11,1.21.12)"
            forge_range: "[61,62)"
            loader_range: "[61,62)"
            experimental: true
            note: "Compatibility check for Minecraft 1.21.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build compatibility target
        shell: pwsh
        env:
          MINECRAFT_VERSION: ${{ matrix.minecraft }}
          FORGE_VERSION: ${{ matrix.forge }}
          JAVA_TOOLCHAIN_VERSION: ${{ matrix.toolchain }}
          GRADLE_VERSION: ${{ matrix.gradle }}
          FORGEGRADLE_VERSION: ${{ matrix.forgegradle }}
          MINECRAFT_VERSION_RANGE: ${{ matrix.minecraft_range }}
          FORGE_VERSION_RANGE: ${{ matrix.forge_range }}
          LOADER_VERSION_RANGE: ${{ matrix.loader_range }}
        run: |
          echo "Testing ${{ matrix.note }}"
          echo "Minecraft ${env:MINECRAFT_VERSION}, Forge ${env:FORGE_VERSION}, Java toolchain ${env:JAVA_TOOLCHAIN_VERSION}"
          echo "Gradle ${env:GRADLE_VERSION}, ForgeGradle ${env:FORGEGRADLE_VERSION}"

          $wrapperProperties = "gradle/wrapper/gradle-wrapper.properties"
          (Get-Content $wrapperProperties) `
            -replace "gradle-[0-9.]+-bin\.zip", "gradle-${env:GRADLE_VERSION}-bin.zip" |
            Set-Content $wrapperProperties

          (Get-Content "build.gradle") `
            -replace "id 'net\.minecraftforge\.gradle' version '[^']+'", "id 'net.minecraftforge.gradle' version '${env:FORGEGRADLE_VERSION}'" |
            Set-Content "build.gradle"

          $gradleArgs = @(
            "build",
            "-Pminecraft_version=${env:MINECRAFT_VERSION}",
            "-Pforge_version=${env:FORGE_VERSION}",
            "-Pjava_toolchain_version=${env:JAVA_TOOLCHAIN_VERSION}",
            "-Pminecraft_version_range=${env:MINECRAFT_VERSION_RANGE}",
            "-Pforge_version_range=${env:FORGE_VERSION_RANGE}",
            "-Ploader_version_range=${env:LOADER_VERSION_RANGE}",
            "--stacktrace"
          )
          ./gradlew.bat @gradleArgs
